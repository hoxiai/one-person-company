<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .hoxi-fill { fill: #0F172A; }
    .hoxi-stroke { stroke: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .hoxi-fill { fill: #F8FAFC; }
      .hoxi-stroke { stroke: #F8FAFC; }
    }
  </style>
  <!-- 合喜 (Hoxi) 科技笑颜单色标 (合之檐 + H之目 + 喜之弧) -->
  <!-- 1. 人字顶檐 (合) -->
  <path class="hoxi-fill" d="M32 8L52 21H44L32 13L20 21H12L32 8Z" />
  <!-- 2. 双立柱专注之眸 (H 骨架) -->
  <rect class="hoxi-fill" x="20" y="25" width="6.5" height="12" rx="3.25" />
  <rect class="hoxi-fill" x="37.5" y="25" width="6.5" height="12" rx="3.25" />
  <!-- 3. 科技微笑弧线 (喜) -->
  <path class="hoxi-stroke" d="M19 42.5C23 50 41 50 45 42.5" stroke-width="5.5" stroke-linecap="round" />
</svg>
