<div id="paycc-payment-container" class="flex flex-col items-center justify-center py-6 w-full">
  
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#1C1D1E] border border-[#2B2D31] shadow-lg mb-4">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="4" width="20" height="16" rx="3" stroke="#22C55E" stroke-width="2" stroke-linejoin="round"/>
        <path d="M2 10H22" stroke="#22C55E" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="17" cy="15" r="2" fill="#22C55E"/>
      </svg>
    </div>
    <h3 class="text-xl font-bold text-white mb-2">Secure Checkout via Pay.cc</h3>
    <p class="text-sm text-gray-400 max-w-sm mx-auto">
      You will be redirected to Pay.cc to securely enter your card details and complete the transaction.
    </p>
  </div>

  <button 
    id="paycc-pay-button"
    class="relative group overflow-hidden w-full max-w-md bg-[#22C55E] text-white font-semibold rounded-xl px-6 py-4 transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(34,197,94,0.4)] flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
  >
    <div class="absolute inset-0 bg-gradient-to-r from-green-400 to-[#22C55E] opacity-0 group-hover:opacity-100 transition-opacity"></div>
    <span class="relative flex items-center gap-2">
      <span>Pay via Credit Card</span>
      <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
      </svg>
    </span>
  </button>

  <div id="paycc-error-message" class="mt-4 text-red-400 text-sm hidden"></div>
</div>

<script>
  (function() {
    const orderId = '{$orderId}';
    const amount = '{$amount}';
    const button = document.getElementById('paycc-pay-button');
    const errorContainer = document.getElementById('paycc-error-message');
    
    if (window._payccPaymentInitialized === orderId) return;
    window._payccPaymentInitialized = orderId;

    const showError = (msg) => {
      if (errorContainer) {
        errorContainer.textContent = msg;
        errorContainer.classList.remove('hidden');
      }
      button.disabled = false;
      button.innerHTML = 'Proceed to Pay.cc';
    };

    button.addEventListener('click', async () => {
      try {
        button.disabled = true;
        button.innerHTML = '<span class="relative flex items-center gap-2"><svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Connecting...</span></span>';
        if (errorContainer) errorContainer.classList.add('hidden');

        const successUrl = window.location.origin + '/callback/' + orderId;
        const cancelUrl = window.location.origin + '/callback/cancel?orderId=' + orderId;
        
        // Unified generic endpoint
        const response = await fetch('/api/payments/initiate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            orderId: orderId,
            methodCode: 'paycc', // Folder name
            returnUrl: successUrl,
            cancelUrl: cancelUrl
          })
        });
        const result = await response.json();

        if (result.code === 0 && result.data && result.data.paymentUrl) {
          window.location.href = result.data.paymentUrl;
        } else {
          showError(result.message || 'Failed to initialize Pay.cc checkout. Please try again.');
        }

      } catch (error) {
        console.error('Pay.cc init error:', error);
        showError(error.message || 'Network error occurred. Please check your connection and try again.');
      }
    });
  })();
</script>
