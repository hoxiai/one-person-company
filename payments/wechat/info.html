<style>
body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#wechat-container {
  width: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
}
.wechat-card {
  width: 100%;
  max-width: 420px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 18px;
  padding: 20px;
  box-sizing: border-box;
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  text-align: center;
}
.pay-btn {
  width: 100%;
  border: none;
  border-radius: 12px;
  background: #07c160;
  color: #fff;
  padding: 14px 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.pay-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.hint {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 10px;
}
.status {
  color: #111827;
  font-size: 14px;
  margin-top: 14px;
}
.error-msg {
  color: #dc2626;
  font-size: 14px;
  margin-top: 12px;
}
</style>

<div id="wechat-container">
  <div class="wechat-card">
    <button id="wechat-btn" class="pay-btn" onclick="startWechatCheckout()">
      微信支付
    </button>
    <div class="hint" id="hint">
      桌面端将展示扫码二维码；手机浏览器会跳转到微信支付 H5 页面。
    </div>
    <div id="status" class="status"></div>
    <div id="error" class="error-msg"></div>
  </div>
</div>

<script>
window.wechatPayPollingTimer = null;
window.isWechatPayProcessing = false;

function stopWechatPolling() {
  if (window.wechatPayPollingTimer) {
    clearInterval(window.wechatPayPollingTimer);
    window.wechatPayPollingTimer = null;
  }
}

async function pollWechatOrder(orderId) {
  stopWechatPolling();
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');
  window.wechatPayPollingTimer = setInterval(async () => {
    try {
      const response = await fetch(`/api/orders/status?orderId=${encodeURIComponent(orderId)}`, {
        credentials: 'same-origin'
      });
      const res = await response.json();
      if (res.code === 0 && res.data?.payStatus === 'paid') {
        stopWechatPolling();
        statusEl.innerText = '支付成功，订单已确认';
        window.dispatchEvent(new CustomEvent('payment-qr-clear', {
          detail: { orderId }
        }));
        window.dispatchEvent(new CustomEvent('order-success', {
          detail: { orderId }
        }));
      }
    } catch (error) {
      errorEl.innerText = error.message || '查询支付状态失败';
    }
  }, 2500);
}

window.startWechatCheckout = async function() {
  if (window.isWechatPayProcessing) return;
  window.isWechatPayProcessing = true;

  const btn = document.getElementById('wechat-btn');
  const statusEl = document.getElementById('status');
  const errorEl = document.getElementById('error');

  btn.disabled = true;
  window.dispatchEvent(new CustomEvent('payment-qr-clear', {
    detail: { orderId: '{$orderId}' }
  }));
  statusEl.innerText = '正在创建微信支付订单...';
  errorEl.innerText = '';

  try {
    const orderId = '{$orderId}';
    const response = await fetch('/api/payments/initiate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        orderId,
        methodCode: 'wechat',
        returnUrl: window.location.origin + '/callback/' + orderId,
        cancelUrl: window.location.origin + '/callback/cancel?orderId=' + orderId
      })
    });

    const res = await response.json();
    const paymentUrl = res?.data?.paymentUrl || '';
    const qrCodeText = res?.data?.qrCodeText || '';
    const tradeType = String(res?.data?.tradeType || '').toLowerCase();
    if (res.code !== 0 || (!paymentUrl && !qrCodeText)) {
      throw new Error(res.message || 'Failed to create Wechat Pay session');
    }

    if (tradeType === 'h5' && /^https:\/\/wx\.tenpay\.com/i.test(paymentUrl)) {
      statusEl.innerText = '即将跳转到微信支付...';
      window.dispatchEvent(new CustomEvent('payment-qr-clear', {
        detail: { orderId }
      }));
      window.top.location.href = paymentUrl;
      return;
    }

    statusEl.innerText = '请使用微信扫一扫完成支付';
    const qrPayload = qrCodeText || paymentUrl;
    window.dispatchEvent(new CustomEvent('payment-qr-ready', {
      detail: {
        orderId,
        methodCode: 'wechat',
        qrCodeText: qrPayload,
        paymentUrl,
        message: '请使用微信扫一扫完成支付'
      }
    }));

    pollWechatOrder(orderId);
  } catch (error) {
    btn.disabled = false;
    statusEl.innerText = '';
    errorEl.innerText = error.message || 'Wechat Pay init failed';
    window.isWechatPayProcessing = false;
    window.dispatchEvent(new CustomEvent('payment-qr-clear', {
      detail: { orderId: '{$orderId}' }
    }));
  }
}

window.addEventListener('order-success', function() {
  const btn = document.getElementById('wechat-btn');
  if (btn) btn.disabled = false;
  window.isWechatPayProcessing = false;
  stopWechatPolling();
});

window.addEventListener('order-error', function() {
  const btn = document.getElementById('wechat-btn');
  if (btn) btn.disabled = false;
  window.isWechatPayProcessing = false;
  stopWechatPolling();
  window.dispatchEvent(new CustomEvent('payment-qr-clear', {
    detail: { orderId: '{$orderId}' }
  }));
});
</script>
